services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wts
      POSTGRES_PASSWORD: wts
      POSTGRES_DB: wts
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wts"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  pgdata:
